<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Noticias</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#12213a" />
<style>
  :root {
    --bg: #0c1424;
    --card: #16233a;
    --border: #263453;
    --gold: #e8c468;
    --text: #eef1f6;
    --muted: #9aa7bd;
    --danger: #e0685f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: relative;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 1.1rem;
    margin: 0;
    color: var(--gold);
    letter-spacing: 0.02em;
  }
  #refresh {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.35rem 0.65rem;
    font-size: 0.82rem;
    cursor: pointer;
  }
  #refresh:active { opacity: 0.7; }
  #stage {
    position: relative;
    height: calc(100% - 52px);
    overflow: hidden;
    touch-action: none;
  }
  .fullcard {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 1.4rem 1.3rem 1.6rem;
    background: var(--card);
    user-select: none;
  }
  .meta {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
    font-size: 0.74rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 1rem;
  }
  .source {
    background: var(--border);
    color: var(--gold);
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    font-weight: 600;
  }
  .fullcard .title {
    color: var(--text);
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.32;
    margin: 0 0 1rem;
  }
  .fullcard .summary {
    color: var(--muted);
    font-size: 1.02rem;
    line-height: 1.5;
    margin: 0;
    overflow-y: auto;
    flex: 1;
  }
  .read-more {
    display: block;
    text-align: center;
    margin-top: 1.2rem;
    padding: 0.85rem 0;
    border-radius: 10px;
    border: 1px solid var(--gold);
    color: var(--gold);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .read-more:active { opacity: 0.7; }
  .swipe-hint {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    opacity: 0.65;
    margin-top: 0.7rem;
  }
  #status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    padding: 2rem;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<header>
  <h1>Noticias</h1>
  <button id="refresh" type="button">↻ actualizar</button>
</header>
<div id="stage">
  <div id="status"></div>
</div>

<script>
const SUPABASE_URL = 'https://zqwkznlgbkofsrygqezk.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpxd2t6bmxnYmtvZnNyeWdxZXprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1MTAzMTAsImV4cCI6MjA5MTA4NjMxMH0.GNt-G_RUcxLYCpSqAKKI4KxNU87bBEQAJVCr88R2wQE';
const FEED_LIMIT = 30;
const PREFETCH_WHEN_LEFT = 5; // pedir más cuando queden pocas notas en la cola
const SWIPE_UP_THRESHOLD = 80; // px para que el gesto cuente como "siguiente"

// Umbrales de la señal implícita por velocidad de swipe (tiempo en pantalla antes de deslizar).
// La pasó volando (no le interesó ni el título) -> dismiss graduado, más fuerte cuanto más rápido.
// Se quedó mirándola -> like graduado, más fuerte cuanto más se quedó (hasta un tope).
const FAST_SKIP_SECONDS = 1.5;
const SLOW_READ_SECONDS = 4;

const stageEl = document.getElementById('stage');
const statusEl = document.getElementById('status');
const refreshBtn = document.getElementById('refresh');

const SOURCE_LABELS = {
  clarin: 'Clarín',
  lanacion: 'La Nación',
  iprofesional: 'iProfesional',
  infobae: 'Infobae',
  ambito: 'Ámbito',
  tn: 'TN',
};

let queue = [];
let seenIds = new Set();
let currentIndex = -1;
let currentCard = null;
let shownAt = 0;
let loadingMore = false;

function clamp(x, lo, hi) {
  return Math.max(lo, Math.min(hi, x));
}

function setStatus(text) {
  statusEl.textContent = text;
  statusEl.style.display = text ? 'flex' : 'none';
}

async function fetchBatch() {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/news-rank?limit=${FEED_LIMIT}`, {
    headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
  });
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data.feed || [];
}

async function loadMore() {
  if (loadingMore) return;
  loadingMore = true;
  try {
    const batch = await fetchBatch();
    for (const item of batch) {
      if (!seenIds.has(item.id)) {
        seenIds.add(item.id);
        queue.push(item);
      }
    }
  } catch (err) {
    // si falla el prefetch en silencio, ya se reintenta la próxima vez que se acerque el final
    console.warn('prefetch falló', err);
  } finally {
    loadingMore = false;
  }
}

async function start() {
  setStatus('Cargando...');
  queue = [];
  seenIds = new Set();
  currentIndex = -1;
  try {
    await loadMore();
  } catch (err) {
    setStatus(`No se pudo cargar el feed (${err.message}). Probá actualizar de nuevo.`);
    return;
  }
  if (!queue.length) {
    setStatus('No hay noticias recientes todavía. news-sync corre cada 30-60 min.');
    return;
  }
  setStatus('');
  showCard(0);
}

function showCard(index) {
  if (index < 0 || index >= queue.length) return;
  currentIndex = index;
  if (queue.length - index <= PREFETCH_WHEN_LEFT) loadMore();

  if (currentCard) currentCard.remove();
  currentCard = renderFullcard(queue[index]);
  stageEl.appendChild(currentCard);
  shownAt = Date.now();
  recordInteraction(queue[index].id, 'view');
}

function renderFullcard(item) {
  const card = document.createElement('div');
  card.className = 'fullcard';

  const meta = document.createElement('div');
  meta.className = 'meta';
  const source = document.createElement('span');
  source.className = 'source';
  source.textContent = SOURCE_LABELS[item.source] || item.source;
  meta.appendChild(source);
  if (item.topic_label) {
    const topic = document.createElement('span');
    topic.textContent = item.topic_label;
    meta.appendChild(topic);
  }
  card.appendChild(meta);

  const title = document.createElement('h2');
  title.className = 'title';
  title.textContent = item.title;
  card.appendChild(title);

  if (item.summary) {
    const summary = document.createElement('p');
    summary.className = 'summary';
    summary.textContent = item.summary;
    card.appendChild(summary);
  }

  const readMore = document.createElement('a');
  readMore.className = 'read-more';
  readMore.href = item.url;
  readMore.target = '_blank';
  readMore.rel = 'noopener';
  readMore.textContent = 'Leer nota completa ↗';
  readMore.addEventListener('click', () => recordInteraction(item.id, 'like'));
  card.appendChild(readMore);

  const hint = document.createElement('div');
  hint.className = 'swipe-hint';
  hint.textContent = '▲ deslizá para la próxima';
  card.appendChild(hint);

  return card;
}

function classifyDwell(dwellMs) {
  const s = dwellMs / 1000;
  if (s < FAST_SKIP_SECONDS) {
    const weight = clamp(1 - s / FAST_SKIP_SECONDS, 0.2, 1);
    return { action: 'implicit_dismiss', weight };
  }
  if (s >= SLOW_READ_SECONDS) {
    const weight = clamp((s - SLOW_READ_SECONDS) / SLOW_READ_SECONDS, 0.2, 0.8);
    return { action: 'implicit_like', weight };
  }
  return null; // zona ambigua: pasó un tiempo intermedio, no queda claro qué significa
}

function advance(direction) {
  if (direction > 0) {
    const dwellMs = Date.now() - shownAt;
    const signal = classifyDwell(dwellMs);
    if (signal) recordInteraction(queue[currentIndex].id, signal.action, signal.weight);
  }
  const next = currentIndex + direction;
  if (next < 0 || next >= queue.length) return; // sin más para atrás/adelante todavía
  showCard(next);
}

function recordInteraction(articleId, action, weight) {
  const body = { p_article_id: articleId, p_action: action };
  if (typeof weight === 'number') body.p_weight = weight;
  fetch(`${SUPABASE_URL}/rest/v1/rpc/news_record_interaction`, {
    method: 'POST',
    headers: {
      apikey: ANON_KEY,
      Authorization: `Bearer ${ANON_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  }).catch(() => {});
}

// Swipe vertical: arriba = siguiente, abajo = anterior. La velocidad no se mide en px/ms
// del gesto en sí, sino en cuánto tiempo estuvo la nota en pantalla antes del swipe (eso
// es lo que realmente indica si la leyó o la pasó de largo).
let dragging = false;
let startY = 0;
let dy = 0;

stageEl.addEventListener('pointerdown', (e) => {
  if (e.target.closest('a.read-more')) return;
  if (!currentCard) return;
  dragging = true;
  startY = e.clientY;
  dy = 0;
  currentCard.style.transition = 'none';
  stageEl.setPointerCapture(e.pointerId);
});

stageEl.addEventListener('pointermove', (e) => {
  if (!dragging || !currentCard) return;
  dy = e.clientY - startY;
  currentCard.style.transform = `translateY(${dy}px)`;
  currentCard.style.opacity = String(clamp(1 - Math.abs(dy) / 500, 0.4, 1));
});

function onPointerEnd() {
  if (!dragging || !currentCard) return;
  dragging = false;
  const card = currentCard;
  card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
  if (dy < -SWIPE_UP_THRESHOLD) {
    card.style.transform = 'translateY(-100%)';
    card.style.opacity = '0';
    advance(1);
  } else if (dy > SWIPE_UP_THRESHOLD) {
    card.style.transform = 'translateY(100%)';
    card.style.opacity = '0';
    advance(-1);
  } else {
    card.style.transform = '';
    card.style.opacity = '';
  }
}

stageEl.addEventListener('pointerup', onPointerEnd);
stageEl.addEventListener('pointercancel', onPointerEnd);

// Rueda del mouse / trackpad como alternativa al swipe táctil (desktop)
let wheelLock = false;
stageEl.addEventListener('wheel', (e) => {
  if (wheelLock) return;
  if (Math.abs(e.deltaY) < 30) return;
  wheelLock = true;
  advance(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => { wheelLock = false; }, 350);
});

refreshBtn.addEventListener('click', start);
start();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
