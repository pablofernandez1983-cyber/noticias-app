<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Noticias</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#12213a" />
<style>
  :root {
    --bg: #0c1424;
    --card: #16233a;
    --border: #263453;
    --gold: #e8c468;
    --text: #eef1f6;
    --muted: #9aa7bd;
    --danger: #e0685f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: relative;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  header h1 {
    font-size: 1.1rem;
    margin: 0;
    color: var(--gold);
    letter-spacing: 0.02em;
  }
  .header-actions { display: flex; gap: 0.5rem; }
  .header-actions button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.35rem 0.65rem;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .header-actions button:active { opacity: 0.7; }
  #categoryDots {
    display: flex;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.5rem 0 0.4rem;
    background: var(--bg);
  }
  #categoryDots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
  }
  #categoryDots span.active { background: var(--gold); }
  #stage {
    position: relative;
    height: calc(100% - 52px - 22px);
    overflow: hidden;
    touch-action: none;
  }
  #cardLayer {
    position: absolute;
    inset: 0;
  }
  .fullcard {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 1.4rem 1.3rem 1.6rem;
    background: var(--card);
    user-select: none;
    touch-action: none;
  }
  .meta {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 1.1rem;
  }
  .source {
    background: var(--border);
    color: var(--gold);
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    font-weight: 600;
  }
  .fullcard .title {
    color: var(--text);
    font-size: clamp(1.7rem, 6vw, 2.5rem);
    font-weight: 700;
    line-height: 1.26;
    margin: 0 0 1.1rem;
  }
  .fullcard .summary {
    color: var(--muted);
    font-size: clamp(1.3rem, 4.4vw, 1.75rem);
    line-height: 1.5;
    margin: 0;
    flex: 1;
    touch-action: none;
  }
  .read-more {
    display: block;
    text-align: center;
    margin-top: 1.2rem;
    padding: 0.9rem 0;
    border-radius: 10px;
    border: 1px solid var(--gold);
    color: var(--gold);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    touch-action: manipulation;
  }
  .read-more:active { opacity: 0.7; }
  .swipe-hint {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    opacity: 0.6;
    margin-top: 0.8rem;
  }
  .heart-burst {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7rem;
    pointer-events: none;
    animation: heartPop 0.75s ease forwards;
  }
  @keyframes heartPop {
    0% { transform: scale(0.3); opacity: 0; }
    18% { transform: scale(1.2); opacity: 1; }
    35% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }
  #status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    padding: 2rem;
    font-size: 0.95rem;
  }
  #settingsOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  #settingsOverlay.open { display: flex; }
  #settingsPanel {
    background: var(--card);
    border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    overflow-y: auto;
    padding: 1.2rem 1.3rem 1.6rem;
  }
  #settingsPanel h2 {
    margin: 0 0 0.8rem;
    color: var(--gold);
    font-size: 1.05rem;
  }
  #settingsPanel h3 {
    margin: 1.1rem 0 0.3rem;
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .source-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .source-row input[type='checkbox'] { width: 20px; height: 20px; accent-color: var(--gold); }
  #addSourceForm { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.6rem; }
  #addSourceForm input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    font-size: 0.92rem;
  }
  #addSourceForm button {
    padding: 0.65rem;
    border-radius: 8px;
    border: 1px solid var(--gold);
    color: var(--gold);
    background: transparent;
    font-weight: 600;
  }
  .settings-hint { color: var(--muted); font-size: 0.78rem; margin-top: 0.8rem; }
  #settingsClose {
    display: block;
    margin: 1.1rem auto 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.85rem;
  }
  #userOverlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1.5rem;
  }
  #userOverlay.open { display: flex; }
  #userPanel { width: 100%; max-width: 360px; text-align: center; }
  #userPanel h2 { color: var(--gold); margin: 0 0 0.4rem; font-size: 1.3rem; }
  #userPanel p { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.4rem; }
  #userPabloBtn {
    width: 100%;
    padding: 0.9rem;
    border-radius: 10px;
    border: 1px solid var(--gold);
    background: var(--gold);
    color: #1a1305;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 1.2rem;
  }
  #userDivider { color: var(--muted); font-size: 0.78rem; margin-bottom: 1rem; }
  #userForm { display: flex; gap: 0.5rem; }
  #userNameInput {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.7rem 0.85rem;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  #userForm button {
    padding: 0.7rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--text);
    background: transparent;
    font-weight: 600;
  }
  #changeUserBtn {
    display: block;
    width: 100%;
    margin-top: 1rem;
    padding: 0.6rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: transparent;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<header>
  <h1 id="categoryTitle">Noticias</h1>
  <div class="header-actions">
    <button id="settingsBtn" type="button">⚙</button>
    <button id="refresh" type="button">↻</button>
  </div>
</header>
<div id="categoryDots"></div>
<div id="stage">
  <div id="cardLayer"></div>
  <div id="status"></div>
</div>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <h2>Fuentes</h2>
    <div id="settingsBody">Cargando...</div>
    <button id="changeUserBtn" type="button">Cambiar de usuario</button>
    <button id="settingsClose" type="button">Cerrar</button>
  </div>
</div>

<div id="userOverlay">
  <div id="userPanel">
    <h2>¿Quién sos?</h2>
    <p>Cada usuario tiene su propio aprendizaje de preferencias.</p>
    <button id="userPabloBtn" type="button">Soy Pablo</button>
    <div id="userDivider">— o —</div>
    <form id="userForm">
      <input id="userNameInput" placeholder="Tu nombre" required />
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zqwkznlgbkofsrygqezk.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpxd2t6bmxnYmtvZnNyeWdxZXprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1MTAzMTAsImV4cCI6MjA5MTA4NjMxMH0.GNt-G_RUcxLYCpSqAKKI4KxNU87bBEQAJVCr88R2wQE';
const FEED_LIMIT = 30;
const PREFETCH_WHEN_LEFT = 5; // pedir más cuando queden pocas notas en la cola
const SWIPE_UP_THRESHOLD = 80; // px para que el gesto cuente como swipe vertical (no tap)
const SWIPE_SIDE_THRESHOLD = 80; // px para que el gesto cuente como cambio de categoría
const TAP_MOVE_THRESHOLD = 12; // px de movimiento máximo para que siga contando como tap
const DOUBLE_TAP_MS = 320;
const DOUBLE_TAP_MAX_DIST = 60; // px entre el 1er y 2do tap para contar como doble tap
const SINGLE_TAP_DELAY_MS = 280; // espera antes de confirmar tap simple (por si viene el 2do)

// Umbrales de la señal implícita por velocidad de swipe (tiempo en pantalla antes de deslizar).
// La pasó volando (no le interesó ni el título) -> dismiss graduado, más fuerte cuanto más rápido.
// Se quedó mirándola -> like graduado, más fuerte cuanto más se quedó (hasta un tope).
const FAST_SKIP_SECONDS = 1.5;
const SLOW_READ_SECONDS = 4;

const stageEl = document.getElementById('stage');
const cardLayerEl = document.getElementById('cardLayer');
const statusEl = document.getElementById('status');
const refreshBtn = document.getElementById('refresh');
const settingsBtn = document.getElementById('settingsBtn');
const settingsOverlay = document.getElementById('settingsOverlay');
const settingsBody = document.getElementById('settingsBody');
const settingsClose = document.getElementById('settingsClose');
const changeUserBtn = document.getElementById('changeUserBtn');
const categoryTitleEl = document.getElementById('categoryTitle');
const categoryDotsEl = document.getElementById('categoryDots');
const userOverlay = document.getElementById('userOverlay');
const userPabloBtn = document.getElementById('userPabloBtn');
const userForm = document.getElementById('userForm');
const userNameInput = document.getElementById('userNameInput');

// Multi-usuario: cada quien aprende por su cuenta (alpha/beta y "ya visto" son por
// usuario). En este dispositivo, una vez elegido, queda guardado en localStorage y
// no se vuelve a preguntar — "cambiar de usuario" en ⚙ borra ese dato para re-elegir.
const USUARIO_KEY = 'noticias_usuario';
let usuario = localStorage.getItem(USUARIO_KEY) || null;

function slugifyUsuario(name) {
  const base = name
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '');
  return base || 'usuario';
}

function ensureUsuario() {
  return new Promise((resolve) => {
    if (usuario) {
      resolve(usuario);
      return;
    }
    userOverlay.classList.add('open');
    const finish = (name) => {
      usuario = slugifyUsuario(name);
      localStorage.setItem(USUARIO_KEY, usuario);
      userOverlay.classList.remove('open');
      resolve(usuario);
    };
    userPabloBtn.onclick = () => finish('pablo');
    userForm.onsubmit = (e) => {
      e.preventDefault();
      const name = userNameInput.value.trim();
      if (!name) return;
      finish(name);
    };
  });
}

// "Para vos" (feed general) + las categorías detectadas de tus intereses (news_interest_seeds).
// Swipe horizontal (izquierda/derecha) navega entre estas, como pasar de "Para ti" a
// "Siguiendo" en TikTok — acá en vez de gente que seguís, son tus 4 temas de interés.
let categories = [{ id: null, short_label: 'Noticias' }];
let currentCategoryIndex = 0;

let queue = [];
let seenIds = new Set();
let currentIndex = -1;
// Las 3 notas se arman siempre en el DOM (anterior/actual/próxima), apiladas y
// desplazadas fuera de vista, para que al arrastrar ya se vea asomando la que sigue
// (o la anterior), como en TikTok, en vez de que aparezca recién al soltar.
let cards = { prev: null, current: null, next: null };
let shownAt = 0;
let loadingMore = false;

function clamp(x, lo, hi) {
  return Math.max(lo, Math.min(hi, x));
}

function setStatus(text) {
  statusEl.textContent = text;
  statusEl.style.display = text ? 'flex' : 'none';
}

async function loadCategories() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/news_interest_seeds?select=id,short_label&order=id.asc`, {
      headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
    });
    const seeds = await res.json();
    if (Array.isArray(seeds) && seeds.length) {
      categories = [{ id: null, short_label: 'Para vos' }, ...seeds];
    }
  } catch (err) {
    console.warn('no se pudieron cargar las categorías', err);
  }
  renderCategoryDots();
  updateCategoryHeader();
}

function renderCategoryDots() {
  categoryDotsEl.innerHTML = '';
  if (categories.length <= 1) return;
  categories.forEach((_, i) => {
    const dot = document.createElement('span');
    if (i === currentCategoryIndex) dot.className = 'active';
    categoryDotsEl.appendChild(dot);
  });
}

function updateCategoryHeader() {
  categoryTitleEl.textContent = categories[currentCategoryIndex]?.short_label ?? 'Noticias';
  renderCategoryDots();
}

async function fetchBatch() {
  const seedId = categories[currentCategoryIndex]?.id;
  const seedParam = seedId != null ? `&seed_id=${seedId}` : '';
  const res = await fetch(`${SUPABASE_URL}/functions/v1/news-rank?limit=${FEED_LIMIT}${seedParam}&usuario=${encodeURIComponent(usuario)}`, {
    headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
  });
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data.feed || [];
}

async function loadMore() {
  if (loadingMore) return;
  loadingMore = true;
  try {
    const batch = await fetchBatch();
    for (const item of batch) {
      if (!seenIds.has(item.id)) {
        seenIds.add(item.id);
        queue.push(item);
      }
    }
    ensureNextCard();
  } catch (err) {
    // si falla el prefetch en silencio, ya se reintenta la próxima vez que se acerque el final
    console.warn('prefetch falló', err);
  } finally {
    loadingMore = false;
  }
}

async function loadCategoryFeed() {
  setStatus('Cargando...');
  cardLayerEl.innerHTML = '';
  cards = { prev: null, current: null, next: null };
  queue = [];
  seenIds = new Set();
  currentIndex = -1;
  try {
    await loadMore();
  } catch (err) {
    setStatus(`No se pudo cargar el feed (${err.message}). Probá actualizar de nuevo.`);
    return;
  }
  if (!queue.length) {
    const label = categories[currentCategoryIndex]?.short_label ?? '';
    setStatus(
      currentCategoryIndex === 0
        ? 'No hay noticias recientes todavía. news-sync corre cada 30-60 min.'
        : `Todavía no hay suficientes notas de "${label}". Probá "Para vos" o volvé más tarde.`
    );
    return;
  }
  setStatus('');
  rebuildStack(0);
}

function switchCategory(newIndex) {
  const clamped = clamp(newIndex, 0, categories.length - 1);
  if (clamped === currentCategoryIndex) return;
  currentCategoryIndex = clamped;
  updateCategoryHeader();
  loadCategoryFeed();
}

async function start() {
  await ensureUsuario();
  await loadCategories();
  await loadCategoryFeed();
}

function buildCardAt(index) {
  if (index < 0 || index >= queue.length) return null;
  return renderFullcard(queue[index]);
}

function positionCards(dy, withTransition) {
  const t = withTransition ? 'transform 0.22s ease, opacity 0.22s ease' : 'none';
  if (cards.prev) {
    cards.prev.style.transition = t;
    cards.prev.style.transform = `translateY(calc(-100% + ${dy}px))`;
  }
  if (cards.current) {
    cards.current.style.transition = t;
    cards.current.style.transform = `translateY(${dy}px)`;
  }
  if (cards.next) {
    cards.next.style.transition = t;
    cards.next.style.transform = `translateY(calc(100% + ${dy}px))`;
  }
}

function rebuildStack(index) {
  currentIndex = index;
  cardLayerEl.innerHTML = '';
  cards.prev = buildCardAt(index - 1);
  cards.current = buildCardAt(index);
  cards.next = buildCardAt(index + 1);
  if (cards.prev) cardLayerEl.appendChild(cards.prev);
  if (cards.current) cardLayerEl.appendChild(cards.current);
  if (cards.next) cardLayerEl.appendChild(cards.next);
  positionCards(0, false);
  if (queue.length - index <= PREFETCH_WHEN_LEFT) loadMore();
  shownAt = Date.now();
  if (cards.current) recordInteraction(queue[index].id, 'view');
}

// Si el prefetch trae más notas después de que ya se había quedado sin "próxima"
// (cola corta), completa el hueco sin rehacer todo el stack.
function ensureNextCard() {
  if (!cards.next && currentIndex + 1 < queue.length) {
    cards.next = buildCardAt(currentIndex + 1);
    cardLayerEl.appendChild(cards.next);
    positionCards(0, false);
  }
}

function renderFullcard(item) {
  const card = document.createElement('div');
  card.className = 'fullcard';

  const meta = document.createElement('div');
  meta.className = 'meta';
  const source = document.createElement('span');
  source.className = 'source';
  source.textContent = item.source_label || item.source;
  meta.appendChild(source);
  if (item.topic_label) {
    const topic = document.createElement('span');
    topic.textContent = item.topic_label;
    meta.appendChild(topic);
  }
  card.appendChild(meta);

  const title = document.createElement('h2');
  title.className = 'title';
  title.textContent = item.title;
  card.appendChild(title);

  if (item.summary) {
    const summary = document.createElement('p');
    summary.className = 'summary';
    summary.textContent = item.summary;
    card.appendChild(summary);
  }

  const readMore = document.createElement('a');
  readMore.className = 'read-more';
  readMore.href = item.url;
  readMore.target = '_blank';
  readMore.rel = 'noopener';
  readMore.textContent = 'Leer nota completa ↗';
  readMore.addEventListener('click', () => recordInteraction(item.id, 'like'));
  card.appendChild(readMore);

  const hint = document.createElement('div');
  hint.className = 'swipe-hint';
  hint.textContent = '▲ próxima · ◀▶ categorías · toque = leer · doble toque = me gusta';
  card.appendChild(hint);

  return card;
}

function classifyDwell(dwellMs) {
  const s = dwellMs / 1000;
  if (s < FAST_SKIP_SECONDS) {
    const weight = clamp(1 - s / FAST_SKIP_SECONDS, 0.2, 1);
    return { action: 'implicit_dismiss', weight };
  }
  if (s >= SLOW_READ_SECONDS) {
    const weight = clamp((s - SLOW_READ_SECONDS) / SLOW_READ_SECONDS, 0.2, 0.8);
    return { action: 'implicit_like', weight };
  }
  return null; // zona ambigua: pasó un tiempo intermedio, no queda claro qué significa
}

function commitAdvance(direction) {
  const targetIndex = currentIndex + direction;
  if (targetIndex < 0 || targetIndex >= queue.length) {
    positionCards(0, true); // no hay a dónde ir: rebote a la posición neutra
    return;
  }

  if (direction > 0) {
    const dwellMs = Date.now() - shownAt;
    const signal = classifyDwell(dwellMs);
    if (signal) recordInteraction(queue[currentIndex].id, signal.action, signal.weight);
  }

  const t = 'transform 0.22s ease, opacity 0.22s ease';
  const { prev, current, next } = cards;
  if (prev) prev.style.transition = t;
  if (current) current.style.transition = t;
  if (next) next.style.transition = t;

  if (direction > 0) {
    if (prev) prev.style.transform = 'translateY(-200%)';
    if (current) current.style.transform = 'translateY(-100%)';
    if (next) next.style.transform = 'translateY(0%)';
  } else {
    if (prev) prev.style.transform = 'translateY(0%)';
    if (current) current.style.transform = 'translateY(100%)';
    if (next) next.style.transform = 'translateY(200%)';
  }

  setTimeout(() => {
    if (direction > 0) {
      if (prev) prev.remove();
      cards.prev = current;
      cards.current = next;
      cards.next = buildCardAt(targetIndex + 1);
      if (cards.next) cardLayerEl.appendChild(cards.next);
    } else {
      if (next) next.remove();
      cards.next = current;
      cards.current = prev;
      cards.prev = buildCardAt(targetIndex - 1);
      if (cards.prev) cardLayerEl.appendChild(cards.prev);
    }
    currentIndex = targetIndex;
    positionCards(0, false);
    shownAt = Date.now();
    if (queue.length - currentIndex <= PREFETCH_WHEN_LEFT) loadMore();
    if (cards.current) recordInteraction(queue[currentIndex].id, 'view');
  }, 230);
}

function recordInteraction(articleId, action, weight) {
  const body = { p_article_id: articleId, p_action: action, p_usuario: usuario };
  if (typeof weight === 'number') body.p_weight = weight;
  fetch(`${SUPABASE_URL}/rest/v1/rpc/news_record_interaction`, {
    method: 'POST',
    headers: {
      apikey: ANON_KEY,
      Authorization: `Bearer ${ANON_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  }).catch(() => {});
}

function showHeartBurst() {
  if (!cards.current) return;
  const heart = document.createElement('div');
  heart.className = 'heart-burst';
  heart.textContent = '❤️';
  cards.current.appendChild(heart);
  heart.addEventListener('animationend', () => heart.remove());
}

function openCurrentArticle() {
  const item = queue[currentIndex];
  if (!item) return;
  recordInteraction(item.id, 'like');
  window.open(item.url, '_blank', 'noopener');
}

function likeCurrentArticle() {
  const item = queue[currentIndex];
  if (!item) return;
  recordInteraction(item.id, 'like');
  showHeartBurst();
}

// Gestos, todos desde cualquier punto de la card (no solo botones):
// - drag vertical: swipe entre notas (arriba = siguiente, abajo = anterior)
// - drag horizontal: cambia de categoría (izquierda = siguiente, derecha = anterior)
// - tap simple (sin drag): abre la nota completa
// - doble tap (sin drag): like explícito + corazón, sin abrir nada
// El eje se decide una sola vez, apenas el gesto supera el umbral de "no es tap", y
// queda fijo el resto del gesto (si no, un drag diagonal saltaría entre los dos modos).
let dragging = false;
let startX = 0, startY = 0, dx = 0, dy = 0, moved = false;
let axis = null; // 'vertical' | 'horizontal'
let lastTapTime = 0, lastTapX = 0, lastTapY = 0;
let singleTapTimer = null;

stageEl.addEventListener('pointerdown', (e) => {
  if (e.target.closest('a.read-more')) return;
  // Sin "if (!cards.current)": si el tema se quedó sin notas no hay carta que arrastrar
  // verticalmente, pero el swipe horizontal para escapar a otra categoría tiene que
  // seguir funcionando igual (si no, quedás atrapado en un tema vacío).
  dragging = true;
  moved = false;
  axis = null;
  startX = e.clientX;
  startY = e.clientY;
  dx = 0;
  dy = 0;
  positionCards(0, false); // corta cualquier transición pendiente antes de arrastrar
  try {
    stageEl.setPointerCapture(e.pointerId);
  } catch (_err) {
    // algunos navegadores/gestos no dejan capturar el puntero; el drag sigue funcionando igual
  }
});

stageEl.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  dx = e.clientX - startX;
  dy = e.clientY - startY;
  if (!moved && (Math.abs(dx) > TAP_MOVE_THRESHOLD || Math.abs(dy) > TAP_MOVE_THRESHOLD)) {
    moved = true;
    axis = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
  }
  if (!moved) return;
  if (axis === 'vertical') {
    positionCards(dy, false);
  } else if (cards.current) {
    cards.current.style.transition = 'none';
    cards.current.style.transform = `translateX(${dx}px)`;
    cards.current.style.opacity = String(clamp(1 - Math.abs(dx) / 500, 0.4, 1));
  }
});

function handleTap(x, y) {
  const now = Date.now();
  const dist = Math.hypot(x - lastTapX, y - lastTapY);
  if (now - lastTapTime < DOUBLE_TAP_MS && dist < DOUBLE_TAP_MAX_DIST) {
    if (singleTapTimer) {
      clearTimeout(singleTapTimer);
      singleTapTimer = null;
    }
    lastTapTime = 0;
    likeCurrentArticle();
    return;
  }
  lastTapTime = now;
  lastTapX = x;
  lastTapY = y;
  singleTapTimer = setTimeout(() => {
    singleTapTimer = null;
    openCurrentArticle();
  }, SINGLE_TAP_DELAY_MS);
}

function onPointerEnd(e) {
  if (!dragging) return;
  dragging = false;

  if (!moved) {
    if (cards.current) handleTap(e.clientX, e.clientY);
    return;
  }

  if (axis === 'vertical') {
    if (!cards.current) return; // nada que avanzar sin carta
    if (dy < -SWIPE_UP_THRESHOLD) {
      commitAdvance(1);
    } else if (dy > SWIPE_UP_THRESHOLD) {
      commitAdvance(-1);
    } else {
      positionCards(0, true); // no llegó al umbral: rebote de vuelta
    }
  } else if (axis === 'horizontal') {
    const card = cards.current;
    if (dx < -SWIPE_SIDE_THRESHOLD) {
      switchCategory(currentCategoryIndex + 1); // izquierda -> siguiente categoría
    } else if (dx > SWIPE_SIDE_THRESHOLD) {
      switchCategory(currentCategoryIndex - 1); // derecha -> categoría anterior
    } else if (card) {
      card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      card.style.transform = '';
      card.style.opacity = '';
    }
  }
}

stageEl.addEventListener('pointerup', onPointerEnd);
stageEl.addEventListener('pointercancel', onPointerEnd);

// Rueda del mouse / trackpad como alternativa al swipe táctil (desktop)
let wheelLock = false;
stageEl.addEventListener('wheel', (e) => {
  if (wheelLock) return;
  if (Math.abs(e.deltaY) < 30) return;
  wheelLock = true;
  commitAdvance(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => { wheelLock = false; }, 350);
});

// Panel de configuración: activar/desactivar fuentes y agregar RSS propio
function slugify(label) {
  const base = label
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '');
  return base || `fuente_${Date.now()}`;
}

function sourcesHeaders(extra) {
  return Object.assign({ apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }, extra || {});
}

function toggleSource(slug, enabled) {
  fetch(`${SUPABASE_URL}/rest/v1/news_sources?slug=eq.${encodeURIComponent(slug)}`, {
    method: 'PATCH',
    headers: sourcesHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ enabled }),
  }).catch(() => {});
}

function renderSourceRow(s) {
  const row = document.createElement('label');
  row.className = 'source-row';
  const span = document.createElement('span');
  span.textContent = s.label;
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.checked = s.enabled;
  input.addEventListener('change', () => toggleSource(s.slug, input.checked));
  row.appendChild(span);
  row.appendChild(input);
  return row;
}

function renderAddForm() {
  const form = document.createElement('form');
  form.id = 'addSourceForm';

  const labelInput = document.createElement('input');
  labelInput.placeholder = 'Nombre (ej: Página 12)';
  labelInput.required = true;

  const urlInput = document.createElement('input');
  urlInput.placeholder = 'URL del RSS';
  urlInput.type = 'url';
  urlInput.required = true;

  const btn = document.createElement('button');
  btn.type = 'submit';
  btn.textContent = 'Agregar';

  form.appendChild(labelInput);
  form.appendChild(urlInput);
  form.appendChild(btn);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const label = labelInput.value.trim();
    const url = urlInput.value.trim();
    if (!label || !url) return;
    btn.disabled = true;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/news_sources`, {
        method: 'POST',
        headers: sourcesHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify({ slug: slugify(label), label, url, enabled: true }),
      });
      if (!res.ok) throw new Error(await res.text());
      labelInput.value = '';
      urlInput.value = '';
      openSettings();
    } catch (err) {
      alert('No se pudo agregar (¿ya existe una fuente con ese nombre?)');
    } finally {
      btn.disabled = false;
    }
  });

  return form;
}

async function openSettings() {
  settingsOverlay.classList.add('open');
  settingsBody.textContent = 'Cargando...';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/news_sources?select=*&order=label.asc`, {
      headers: sourcesHeaders(),
    });
    const sources = await res.json();
    renderSettings(sources);
  } catch (err) {
    settingsBody.textContent = 'No se pudo cargar la lista de fuentes.';
  }
}

function renderSettings(sources) {
  settingsBody.innerHTML = '';
  const active = sources.filter((s) => s.enabled);
  const suggested = sources.filter((s) => !s.enabled);

  const h1 = document.createElement('h3');
  h1.textContent = 'Activas';
  settingsBody.appendChild(h1);
  for (const s of active) settingsBody.appendChild(renderSourceRow(s));

  const h2 = document.createElement('h3');
  h2.textContent = 'Sugeridas';
  settingsBody.appendChild(h2);
  if (!suggested.length) {
    const p = document.createElement('p');
    p.className = 'settings-hint';
    p.textContent = 'No hay más sugerencias por ahora.';
    settingsBody.appendChild(p);
  }
  for (const s of suggested) settingsBody.appendChild(renderSourceRow(s));

  const h3 = document.createElement('h3');
  h3.textContent = 'Agregar RSS propio';
  settingsBody.appendChild(h3);
  settingsBody.appendChild(renderAddForm());

  const hint = document.createElement('p');
  hint.className = 'settings-hint';
  hint.textContent = 'Los cambios se aplican en la próxima sincronización (cada 30-60 min).';
  settingsBody.appendChild(hint);
}

settingsBtn.addEventListener('click', openSettings);
settingsClose.addEventListener('click', () => settingsOverlay.classList.remove('open'));
settingsOverlay.addEventListener('click', (e) => {
  if (e.target === settingsOverlay) settingsOverlay.classList.remove('open');
});
changeUserBtn.addEventListener('click', () => {
  localStorage.removeItem(USUARIO_KEY);
  usuario = null;
  settingsOverlay.classList.remove('open');
  start();
});

refreshBtn.addEventListener('click', start);
start();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
